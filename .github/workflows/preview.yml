name: Deploy Web Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - pnpm-lock.yaml
      - apps/web/**/*
  workflow_dispatch:

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Deploy

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create D1 Database
        id: create_db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DB_NAME="blakesmods-content-pr-${PR_NUMBER}"

          OUTPUT=$(npx wrangler d1 create "$DB_NAME" --json)

          DB_ID=$(echo "$OUTPUT" | jq -r '.database_id')

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Failed to obtain database ID"
            exit 1
          fi

          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          NITRO_PRESET: cloudflare_module
          PREVIEW_DB_NAME: ${{ steps.create_db.outputs.db_name }}
          PREVIEW_DB_ID: ${{ steps.create_db.outputs.db_id }}
          SENTRY_AUTH: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm build --filter @blakesmods/web

      - name: Publish Preview Deployment
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --worker-name blakesmods
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: apps/web/.output

      - name: Comment Preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const deploymentUrl = "${{ steps.wrangler_deploy.outputs.deployment-url }}";

            const commentBody = `🚀 **Cloudflare Worker Preview Deployed!**\n\n🔗 [View Preview Deployment](${deploymentUrl})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            })

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cleanup

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Preview
        run: npx wrangler preview delete --skip-confirmation --worker-name blakesmods
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          wrangler d1 delete "blakesmods-content-pr-${PR_NUMBER}" --skip-confirmation
