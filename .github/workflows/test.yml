name: Test

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.2
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed Database
        run: pnpm run --filter @blakesmods/db seed

      - name: Build
        run: pnpm build

      - name: Run Tests
        run: |
          pnpm run --filter @blakesmods/api start &
          pnpm run --filter @blakesmods/web start &
          npx --no-install wait-on -t 30s http://localhost:5000
          npx --no-install wait-on -t 30s http://localhost:3000
          pnpm test
